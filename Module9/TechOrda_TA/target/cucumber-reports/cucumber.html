e to \"https://solutionshub.epam.com/\"\r\n    And I click on \"Guides\" tab\r\n    And I select \"Solution Owners\" category\r\n    Then only relevant guides are listed\r\n\r\n  Scenario: BLG-01 Social Share\r\n    Given I open the browser\r\n    When I navigate to \"https://solutionshub.epam.com/\"\r\n    And I click on \"Blog\" tab\r\n    And I open any blog post\r\n    And I click the LinkedIn share icon\r\n    Then the share dialog opens with the correct URL\r\n\r\n  Scenario: BLG-02 Tag Filtering\r\n    Given I open the browser\r\n    When I navigate to \"https://solutionshub.epam.com/\"\r\n    And I click on \"Blog\" tab\r\n    And I click on \"Insights\" tag\r\n    Then the feed shows only \"Insights\" articles\r\n\r\n  Scenario: ABT-01 FAQ Interaction\r\n    Given I open the browser\r\n    When I navigate to \"https://solutionshub.epam.com/\"\r\n    And I click on \"About\" tab\r\n    And I click on an FAQ question\r\n    Then the answer expands smoothly\r\n\r\n  Scenario: ABT-02 Main CTA Function\r\n    Given I open the browser\r\n    When I navigate to \"https://solutionshub.epam.com/\"\r\n    And I click on \"About\" tab\r\n    And I click \"Get Started\" button\r\n    Then I am navigated to the Solutions catalog\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"classpath:org/example/features/sample.feature","feature":{"location":{"line":1,"column":1},"tags":[],"language":"en","keyword":"Feature","name":"EPAM SolutionsHub Testing","description":"","children":[{"scenario":{"location":{"line":3,"column":3},"tags":[],"keyword":"Scenario","name":"SOL-01 Filter by Industry","description":"","steps":[{"location":{"line":4,"column":5},"keyword":"Given ","keywordType":"Context","text":"I open the browser","id":"a3c948eb-d373-4a06-9d42-3a3821270042"},{"location":{"line":5,"column":5},"keyword":"When ","keywordType":"Action","text":"I navigate to \"https://solutionshub.epam.com/\"","id":"c365d8dd-e319-425d-a7e0-d9884ba2296e"},{"location
